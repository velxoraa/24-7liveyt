name: KAXMOK 24/7 Live Stream

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kaxmok-24-7-livestream
  cancel-in-progress: true

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      YT_STREAM_KEY: ${{ secrets.YT_STREAM_KEY }}
      ANALYTICS_INGEST_TOKEN: ${{ secrets.ANALYTICS_INGEST_TOKEN }}
      YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
      YT_CLIENT_SECRET_JSON: ${{ secrets.YT_CLIENT_SECRET_JSON }}
      YT_VIDEO_ID: FhD_vXt8MEM
      ANALYTICS_URL: https://kaxmok-analytics.kaxxmok.workers.dev
      NORMAL_BACKGROUND: assets/backgrounds/WhatsApp Video 2026-11-14 at 4.16.22 PM.mp4
      PLAYLIST_ROUNDS: "250"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          npm install

      - name: Validate configuration and media
        shell: bash
        run: |
          python - <<'PY'
          import os
          import sys
          from pathlib import Path

          required = ("YT_STREAM_KEY", "ANALYTICS_INGEST_TOKEN")
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              print("Missing required GitHub secret(s): " + ", ".join(missing))
              sys.exit(1)

          background = Path(os.environ["NORMAL_BACKGROUND"])
          if not background.is_file():
              print(f"Normal background video missing: {background}")
              sys.exit(1)

          songs_dir = Path("songs")
          audio = [p for p in songs_dir.iterdir() if p.is_file() and p.suffix.lower() in {".mp3", ".mpeg", ".mp2"}] if songs_dir.is_dir() else []
          if not audio:
              print("No MP3/MPEG audio files found in songs/")
              sys.exit(1)

          print(f"Validation passed: {len(audio)} audio file(s), background found.")
          PY
          ffmpeg -version | head -n 1
          node --version
          python --version

      - name: Start stream and optional chat reader
        shell: bash
        run: |
          set -u

          python stream.py &
          STREAM_PID=$!
          CHAT_PID=""

          cleanup() {
            if [[ -n "$CHAT_PID" ]]; then
              kill "$CHAT_PID" 2>/dev/null || true
              wait "$CHAT_PID" 2>/dev/null || true
            fi
            kill "$STREAM_PID" 2>/dev/null || true
            wait "$STREAM_PID" 2>/dev/null || true
          }
          trap cleanup EXIT INT TERM

          echo "Started FFmpeg stream process (PID $STREAM_PID)."

          if [[ -n "$YT_TOKEN_JSON" && -n "$YT_CLIENT_SECRET_JSON" ]]; then
            node chat_reader.js &
            CHAT_PID=$!
            echo "Started YouTube chat reader process (PID $CHAT_PID)."

            wait -n -p FINISHED_PID "$STREAM_PID" "$CHAT_PID"
            FIRST_STATUS=$?

            if [[ "$FINISHED_PID" == "$CHAT_PID" ]]; then
              echo "WARNING: YouTube chat reader exited (code $FIRST_STATUS); keeping the music livestream running without chat controls."
              wait "$STREAM_PID"
              exit $?
            fi

            echo "FFmpeg stream process exited with code $FIRST_STATUS."
            exit "$FIRST_STATUS"
          else
            echo "WARNING: YT_TOKEN_JSON and/or YT_CLIENT_SECRET_JSON are missing."
            echo "Music livestream will continue, but YouTube chat reading and !bg commands are disabled."
            wait "$STREAM_PID"
            exit $?
          fi
