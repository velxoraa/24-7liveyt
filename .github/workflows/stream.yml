name: KAXMOK 24/7 Live Stream

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kaxmok-24-7-livestream
  cancel-in-progress: true

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      YT_STREAM_KEY: ${{ secrets.YT_STREAM_KEY }}
      ANALYTICS_INGEST_TOKEN: ${{ secrets.ANALYTICS_INGEST_TOKEN }}
      YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
      YT_CLIENT_SECRET_JSON: ${{ secrets.YT_CLIENT_SECRET_JSON }}
      YT_VIDEO_ID: FhD_vXt8MEM
      ANALYTICS_URL: https://kaxmok-analytics.kaxxmok.workers.dev
      NORMAL_BACKGROUND: assets/backgrounds/WhatsApp Video 2026-11-14 at 4.16.22 PM.mp4
      PLAYLIST_ROUNDS: "250"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          npm install\n          npx playwright install --with-deps chromium

      - name: Validate configuration and media
        shell: bash
        run: |
          python - <<'PY'
          import os
          import sys
          from pathlib import Path

          required = ("YT_STREAM_KEY", "ANALYTICS_INGEST_TOKEN")
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              print("Missing required GitHub secret(s): " + ", ".join(missing))
              sys.exit(1)

          background = Path(os.environ["NORMAL_BACKGROUND"])
          if not background.is_file():
              print(f"Normal background video missing: {background}")
              sys.exit(1)

          songs_dir = Path("songs")
          audio = [p for p in songs_dir.iterdir() if p.is_file() and p.suffix.lower() in {".mp3", ".mpeg", ".mp2"}] if songs_dir.is_dir() else []
          if not audio:
              print("No MP3/MPEG audio files found in songs/")
              sys.exit(1)

          print(f"Validation passed: {len(audio)} audio file(s), background found.")
          PY
          ffmpeg -version | head -n 1
          node --version
          python --version

      - name: Validate quiz overlay and chat command syntax
        shell: bash
        run: |
          python -m py_compile stream.py analytics.py
          node --check html_game_renderer.js
          node --check chat_reader.js

      - name: Start stream and public chat reader
        shell: bash
        run: |
          set -u

          python stream.py &
          STREAM_PID=$!

          # Chat reading is public and does not require OAuth secrets.
          # Restart the reader if YouTube temporarily blocks or disconnects it.
          (
            while kill -0 "$STREAM_PID" 2>/dev/null; do
              echo "Starting public YouTube chat reader (no OAuth required)..."
              node chat_reader.js
              CHAT_STATUS=$?
              if kill -0 "$STREAM_PID" 2>/dev/null; then
                echo "WARNING: Chat reader exited with code $CHAT_STATUS. Retrying in 15 seconds; stream audio remains running."
                sleep 15
              fi
            done
          ) &
          CHAT_SUPERVISOR_PID=$!

          cleanup() {
            kill "$CHAT_SUPERVISOR_PID" 2>/dev/null || true
            pkill -P "$CHAT_SUPERVISOR_PID" 2>/dev/null || true
            kill "$STREAM_PID" 2>/dev/null || true
            wait "$CHAT_SUPERVISOR_PID" 2>/dev/null || true
            wait "$STREAM_PID" 2>/dev/null || true
          }
          trap cleanup EXIT INT TERM

          echo "Started FFmpeg stream (PID $STREAM_PID) and chat supervisor (PID $CHAT_SUPERVISOR_PID)."
          wait "$STREAM_PID"
          STREAM_STATUS=$?
          echo "FFmpeg stream exited with code $STREAM_STATUS."
          exit "$STREAM_STATUS"
