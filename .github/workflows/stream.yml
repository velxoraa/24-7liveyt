name: KAXMOK 24/7 Live Stream

on:
  workflow_dispatch:

permissions:
  contents: read

# Starting another run will stop the previous run in this group.
concurrency:
  group: kaxmok-24-7-livestream
  cancel-in-progress: true

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      YT_STREAM_KEY: ${{ secrets.YT_STREAM_KEY }}
      ANALYTICS_INGEST_TOKEN: ${{ secrets.ANALYTICS_INGEST_TOKEN }}
      YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
      YT_CLIENT_SECRET_JSON: ${{ secrets.YT_CLIENT_SECRET_JSON }}
      YT_VIDEO_ID: KmJwvffMGL4
      ANALYTICS_URL: https://kaxmok-analytics.kaxxmok.workers.dev
      NORMAL_BACKGROUND: assets/backgrounds/WhatsApp Video 2026-11-14 at 4.16.22 PM.mp4
      PLAYLIST_ROUNDS: "250"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          npm install

      - name: Validate configuration and media
        run: |
          if [ -z "$YT_STREAM_KEY" ]; then echo "Missing YT_STREAM_KEY secret"; exit 1; fi
          if [ -z "$ANALYTICS_INGEST_TOKEN" ]; then echo "Missing ANALYTICS_INGEST_TOKEN secret"; exit 1; fi
          if [ ! -f "$NORMAL_BACKGROUND" ]; then echo "Normal background video missing: $NORMAL_BACKGROUND"; exit 1; fi
          found_audio=false
          for file in songs/*; do
            case "$file" in
              *.mp3|*.MP3|*.mpeg|*.MPEG|*.mp2|*.MP2) found_audio=true ;;
            esac
          done
          if [ "$found_audio" != true ]
