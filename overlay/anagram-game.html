const $=id=>document.getElementById(id);
const clean=s=>s.toUpperCase().replace(/[^A-Z]/g,"");
function validWords(entry){return [...new Set(entry[1].split(/\s+/).map(clean).filter(w=>w.length>=3&&w.length<=8&&[...w].every(ch=>entry[0].includes(ch))))]}
function current(){return BANK[puzzleIndex%BANK.length]}
function shuffle(s,seed){let a=[...s];for(let i=a.length-1;i>0;i--){let j=(seed*31+i*17)% (i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function notify(t){$("notice").textContent=t;$("notice").classList.add("show");clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>$("notice").classList.remove("show"),3200)}
function render(){
 const [letters]=current();$("rack").innerHTML=shuffle(letters,round).map(ch=>'<div class="tile">'+ch+'</div>').join("");
 $("goal").textContent=found.length+"/60";$("level").textContent="LEVEL "+(1+Math.floor(found.length/15));
 $("roundline").textContent="ROUND "+round+"   ·   "+String(seconds).padStart(2,"0")+"s LEFT   ·   "+found.length+" WORDS FOUND";
 $("bar").style.width=(seconds/55*100)+"%";
 const groups=[8,7,6,5,4,3].map(n=>({n,words:found.filter(w=>w.length===n)}));
 $("columns").innerHTML=groups.map(g=>'<div class="group"><h3>'+g.n+' LETTER WORDS · '+g.words.length+'</h3><div class="words">'+(g.words.length?g.words.slice(-8).map(w=>'<span class="word">'+w+'</span>').join(""):'<span class="empty"></span><span class="empty"></span><span class="empty"></span>')+'</div></div>').join("");
 $("players").innerHTML=Object.entries(scores).sort((a,b)=>b[1].points-a[1].points).slice(0,5).map(([id,p],i)=>'<div class="player"><span>'+(i+1)+'. '+esc(p.name)+'</span><strong>'+p.points+'</strong></div>').join("")||'<div class="player">BE THE FIRST WORD HUNTER!</div>';
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
window.submitChatWord=(id,name,raw)=>{
 const word=clean(raw);if(!/^[A-Z]{3,8}$/.test(word))return {ok:false,reason:"invalid"};
 const [letters,rawAnswers]=current();const answers=validWords(current());
 if(!answers.includes(word))return {ok:false,reason:"invalid"};
 if(found.includes(word))return {ok:false,reason:"duplicate"};
 found.push(word);const pts=word.length*10+(word.length===letters.length?50:0);
 if(!scores[id])scores[id]={name:String(name).slice(0,18),points:0};scores[id].points+=pts;
 notify(String(name).toUpperCase()+" FOUND "+word+"  +"+pts+" PTS");render();
 if(found.length>=60){notify("60 WORD GOAL CLEARED! NEW LEVEL!");found=[];round++;puzzleIndex++;seconds=55;seen.clear()}
 return {ok:true,points:pts,word};
};
function nextRound(){round++;puzzleIndex++;seconds=55;found=[];seen.clear();render()}
setInterval(()=>{seconds--;if(seconds<=0)nextRound();else render()},1000);
