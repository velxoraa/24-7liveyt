<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KAXMOK • Quiz Arena</title>
<style>
:root{--gold:#f5c76b;--ink:#080b12;--muted:#9ca8ba;--line:rgba(255,255,255,.12);--glass:rgba(9,13,23,.78);--cyan:#7de8ff}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:#f7f8fc;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif}
.stage{position:absolute;inset:0;padding:42px;display:flex;align-items:flex-start;justify-content:space-between;gap:24px}
.panel{background:linear-gradient(145deg,rgba(14,19,31,.88),rgba(6,9,16,.76));border:1px solid var(--line);box-shadow:0 24px 80px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.06);backdrop-filter:blur(18px);border-radius:24px;overflow:hidden}
.quiz{width:min(760px,62vw);padding:28px 30px 26px;position:relative}
.quiz:before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:linear-gradient(var(--gold),transparent 85%)}
.brand{display:flex;align-items:center;gap:12px;color:var(--gold);font-size:12px;letter-spacing:.2em;font-weight:800;text-transform:uppercase}
.brandmark{width:30px;height:30px;border-radius:10px;border:1px solid rgba(245,199,107,.5);display:grid;place-items:center;background:rgba(245,199,107,.1);font-size:15px}
.topline{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.round{font-size:12px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}
.live{display:flex;align-items:center;gap:8px;color:#b5f5cf;font-size:11px;font-weight:700;letter-spacing:.12em}
.dot{width:7px;height:7px;border-radius:50%;background:#61e6a3;box-shadow:0 0 12px #61e6a3}
.category{color:var(--cyan);font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;margin:0 0 12px}
.question{font-size:clamp(22px,2.1vw,34px);font-weight:750;line-height:1.23;letter-spacing:-.035em;margin:0 0 24px;max-width:690px}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.answer{display:flex;align-items:center;gap:13px;min-height:62px;padding:12px 15px;border-radius:15px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.09);font-size:15px;font-weight:600;transition:.18s}
.key{width:29px;height:29px;flex:0 0 29px;display:grid;place-items:center;border-radius:9px;color:var(--gold);background:rgba(245,199,107,.11);border:1px solid rgba(245,199,107,.2);font-size:12px;font-weight:900}
.answer.correct{border-color:rgba(97,230,163,.7);background:rgba(97,230,163,.12)}
.answer.wrong{border-color:rgba(255,112,112,.65);background:rgba(255,112,112,.1)}
.answer.correct .key{background:#61e6a3;color:#07120d}
.footer{display:flex;align-items:center;gap:16px;margin-top:23px}
.track{height:5px;background:rgba(255,255,255,.1);border-radius:9px;flex:1;overflow:hidden}
.fill{height:100%;width:100%;background:linear-gradient(90deg,var(--gold),#ffe6a8);border-radius:9px;transform-origin:left;transform:scaleX(1)}
.timer{font-variant-numeric:tabular-nums;font-size:14px;font-weight:800;color:var(--gold);min-width:36px;text-align:right}
.note{font-size:11px;color:var(--muted);margin-top:12px;display:flex;justify-content:space-between;gap:10px}
.board{width:300px;padding:23px 22px}
.boardhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.boardtitle{font-size:13px;font-weight:850;letter-spacing:.12em;text-transform:uppercase}
.trophy{color:var(--gold);font-size:17px}
.boardlabel{font-size:10px;color:var(--muted);letter-spacing:.13em;text-transform:uppercase;margin:0 0 12px}
.rows{display:flex;flex-direction:column;gap:9px}
.player{display:grid;grid-template-columns:25px 1fr auto;gap:9px;align-items:center;padding:10px 9px;border-radius:12px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.055)}
.rank{font-size:12px;color:var(--muted);font-weight:800;text-align:center}
.avatar{width:29px;height:29px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(135deg,rgba(125,232,255,.2),rgba(245,199,107,.2));color:#fff;font-size:11px;font-weight:900}
.name{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:10px;color:var(--muted);margin-top:3px}
.points{font-size:13px;font-weight:900;color:var(--gold);font-variant-numeric:tabular-nums}
.boardfoot{border-top:1px solid var(--line);margin-top:16px;padding-top:13px;display:flex;justify-content:space-between;color:var(--muted);font-size:10px;letter-spacing:.08em;text-transform:uppercase}
.controls{position:absolute;left:42px;bottom:35px;display:flex;gap:8px;opacity:0;transition:opacity .2s;pointer-events:none}
body.control .controls{opacity:1;pointer-events:auto}
button{border:1px solid rgba(245,199,107,.28);background:rgba(8,12,20,.9);color:#f8e3b6;padding:9px 13px;border-radius:10px;font-weight:700;cursor:pointer}
button:hover{background:rgba(245,199,107,.16)}
.toast{position:absolute;left:50%;bottom:35px;transform:translateX(-50%);padding:12px 20px;border-radius:14px;background:rgba(8,12,20,.92);border:1px solid var(--line);font-size:13px;font-weight:700;opacity:0;transition:opacity .2s}
.toast.show{opacity:1}
@media(max-width:900px){.stage{padding:20px;gap:12px}.quiz{width:calc(100% - 240px);padding:20px}.board{width:220px;padding:16px}.question{font-size:23px}.answer{font-size:12px;min-height:54px;padding:9px}.player{padding:8px 5px}.name{font-size:11px}}
</style>
</head>
<body>
<div class="stage">
<section class="panel quiz" aria-live="polite">
 <div class="topline"><div class="brand"><span class="brandmark">✦</span>KAXMOK <span style="color:#fff">QUIZ ARENA</span></div><div class="live"><span class="dot"></span> LIVE ROUND</div></div>
 <div class="round" id="round">ROUND 01 / 10</div>
 <div style="height:18px"></div>
 <p class="category" id="category">GENERAL KNOWLEDGE</p>
 <h1 class="question" id="question">Loading quiz…</h1>
 <div class="answers" id="answers"></div>
 <div class="footer"><div class="track"><div class="fill" id="fill"></div></div><div class="timer" id="timer">20</div></div>
 <div class="note"><span>CHOOSE A • B • C • D</span><span id="status">FAST ANSWERS EARN MORE</span></div>
</section>
<aside class="panel board">
 <div class="boardhead"><div class="boardtitle">Hall of Fame</div><div class="trophy">♛</div></div>
 <p class="boardlabel">Quiz leaderboard · local overlay</p>
 <div class="rows" id="rows"></div>
 <div class="boardfoot"><span>Top players</span><span id="players">0 PLAYERS</span></div>
</aside>
</div>
<div class="controls" id="controls">
 <button id="next">Next round ↗</button><button id="reset">Reset scores</button><button id="add">Demo score +</button>
</div>
<div class="toast" id="toast"></div>
<script>
const quiz=[
{c:"SCIENCE",q:"Which planet has the most confirmed moons in our solar system?",a:["Mars","Saturn","Earth","Venus"],k:1},
{c:"MUSIC",q:"How many keys does a standard full-size piano have?",a:["76","80","88","92"],k:2},
{c:"TECH",q:"What does the “HTTP” in a website address stand for?",a:["HyperText Transfer Protocol","High Transfer Text Process","Host Text Transit Program","Hyperlink Tracking Tool"],k:0},
{c:"NATURE",q:"Which animal is the largest living mammal?",a:["African elephant","Blue whale","Giraffe","Orca"],k:1},
{c:"GEOGRAPHY",q:"Which is the smallest country in the world by area?",a:["Monaco","Malta","Vatican City","San Marino"],k:2},
{c:"SPACE",q:"What is the name of the galaxy that contains our Solar System?",a:["Andromeda","Milky Way","Whirlpool","Sombrero"],k:1},
{c:"SPORTS",q:"How many players from one team are on court in standard basketball?",a:["4","5","6","7"],k:1},
{c:"FOOD",q:"Which spice is made from the dried stigmas of a crocus flower?",a:["Turmeric","Cardamom","Saffron","Cinnamon"],k:2},
{c:"HISTORY",q:"The ancient city of Petra is located in which modern country?",a:["Egypt","Jordan","Greece","Turkey"],k:1},
{c:"MATH",q:"What is the square root of 144?",a:["10","11","12","14"],k:2}
];
const $=id=>document.getElementById(id);
let index=0,seconds=20,interval=null,locked=false;
let scores=JSON.parse(localStorage.getItem("kaxmokQuizScores")||"{}");
if(new URLSearchParams(location.search).get("control")==="1")document.body.classList.add("control");
function save(){localStorage.setItem("kaxmokQuizScores",JSON.stringify(scores));renderBoard()}
function renderBoard(){
 const sorted=Object.entries(scores).sort((a,b)=>b[1]-a[1]).slice(0,8);
 $("rows").innerHTML=sorted.map(([name,pts],i)=>'<div class="player"><div class="rank">'+String(i+1).padStart(2,"0")+'</div><div style="display:flex;align-items:center;gap:8px;min-width:0"><div class="avatar">'+name.slice(0,2).toUpperCase()+'</div><div style="min-width:0"><div class="name">'+escapeHtml(name)+'</div><div class="sub">QUIZ PLAYER</div></div></div><div class="points">'+pts+'</div></div>').join("")||'<div class="sub">Scores appear as you play.</div>';
 $("players").textContent=Object.keys(scores).length+" PLAYERS";
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function showToast(t){$("toast").textContent=t;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),1800)}
function load(){
 clearInterval(interval);locked=false;seconds=20;
 const q=quiz[index%quiz.length];$("round").textContent="ROUND "+String(index+1).padStart(2,"0")+" / "+quiz.length;
 $("category").textContent=q.c;$("question").textContent=q.q;$("status").textContent="FAST ANSWERS EARN MORE";
 $("answers").innerHTML=q.a.map((x,i)=>'<div class="answer" id="a'+i+'"><span class="key">'+String.fromCharCode(65+i)+'</span><span>'+escapeHtml(x)+'</span></div>').join("");
 $("timer").textContent=seconds;$("fill").style.transform="scaleX(1)";
 interval=setInterval(()=>{seconds--; $("timer").textContent=seconds;$("fill").style.transform="scaleX("+Math.max(0,seconds/20)+")";if(seconds<=0){clearInterval(interval);locked=true;$("status").textContent="TIME UP · NEXT ROUND";$("a"+q.k).classList.add("correct")}},1000);
}
function answer(i,player="KAXMOK"){
 if(locked)return;locked=true;clearInterval(interval);const q=quiz[index%quiz.length];
 document.querySelectorAll(".answer").forEach((el,j)=>{if(j===q.k)el.classList.add("correct");else if(j===i)el.classList.add("wrong")});
 if(i===q.k){const points=100+seconds*5;scores[player]=(scores[player]||0)+points;save();$("status").textContent="+"+points+" POINTS · WELL PLAYED";showToast(player+" scored "+points+" points!")}
 else{$("status").textContent="ANSWER: "+String.fromCharCode(65+q.k)+" · KEEP GOING";showToast("Correct answer: "+String.fromCharCode(65+q.k))}
}
function next(){index++;load()}
$("next").onclick=next;
$("reset").onclick=()=>{scores={};save();showToast("Quiz leaderboard reset")};
$("add").onclick=()=>{scores["Demo Player"]=(scores["Demo Player"]||0)+100;save();showToast("Demo score added")};
document.addEventListener("keydown",e=>{if(["a","b","c","d"].includes(e.key.toLowerCase()))answer(e.key.toLowerCase().charCodeAt(0)-97);if(e.key===" "){e.preventDefault();next()}});
load();renderBoard();
</script>
</body>
</html>
